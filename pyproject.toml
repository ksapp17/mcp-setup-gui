[project]
name = "pythonmcp"
version = "0.1.0"
description = "Turn HTTP APIs into MCP tools and install them in Claude"
readme = "README.md"
authors = [
    { name = "Kaden", email = "kadenmsapp@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=2.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# Plain scripts, not an installable package: uv sync installs the dependencies only
package = false
